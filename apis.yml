aid: super-evil
name: Super Evil
description: >-
  Super Evil (Super Evil Megacorp) is an award-winning independent video game
  studio building shared, cross-platform gaming experiences that push creative
  and technical boundaries. The studio is best known for the MOBA Vainglory and
  the shooter Catalyst Black, and has shipped licensed titles including TMNT:
  Splintered Fate and a Rebel Moon game (Blood Line). Surfaced as a portfolio
  company of General Catalyst and added to the API Evangelist network. As of this
  enrichment pass the studio publishes only a consumer marketing website
  (Gatsby/Netlify) and social channels; it exposes no public developer API,
  documentation, SDK, OpenAPI, developer portal, or status page.
